deployment_id: c1a15@dev-local          # C1-a15 맥 공유 DB 1건(D-261 (3) · D-280 — 장부 줄은 llmops --dev bootstrap. 운영 id c1a15@v1-pg-local은 3단계 전에)
retention_class: dev                     # *@dev-local = 원문 보존 dev 7일(settings Q-D1)
pack:
  repo: ../../c1a15-pack                 # 읽기만(git rev-parse · archive). 원격 없음 — 로컬 태그
  ref: v12                               # 태그 v12(→ 938300b, LLMOps V4 · D-442 — v7 + gpt-4o-mini 허용 줄, 새 시연 시작 상태). 이전 = v11(b7d77b12 → 0159eb4) · 되돌림은 LLMOps 길로만(D-428 덧)
  pack_subdir: pack
  releases_subdir: releases
  expect_revision: "sha256:4c8c0f3d11a7fb707523c7e725b31fd0243df9df4842d67aa79a99e85a43fbab"
execution:                               # Pack v7 pack/execution/deploy-real.yaml 그대로(D-403 Q-2 — release · 장부 · 맥 배포 셋 다 같은 drs) — environment · release_roots는 서버가 씀
  entrypoint: run
  stores:                                # 실제 벡터 DB(text-embedding-3-small 1536) — 질의 임베딩은 아래 embedding 칸으로만 실제(183-01 (가))
    history: {backend: flat-local, release: ir-history-16d297d8, embedding: {mode: real, key_env: OPENAI_API_KEY}}
    manuals: {backend: flat-local, release: ir-manuals-3ae4dcdf, embedding: {mode: real, key_env: OPENAI_API_KEY}}
  models:
    failure_classifier: {release: mr-ai4i-lgbm-large-v1}   # 사용자 모델(ONNX, D-268 · D-272) — 배포 환경에 onnxruntime 1.31.0 필수(맥 .venv KS-3). 되돌림 = mr-c1a15-standin-v1
release_roots_extra:                     # 첫 칸 = R12 쓰기 폴더, 둘째 = 실제 벡터 DB 자리(packrt-1, 읽기만)
  - ../var/c1a15-dev-local/releases
  - ../../agent-pack-runtime-ingest/releases-c1a15
data_dir: ../var/c1a15-dev-local
packs_dir: ../.packs
review_policy: auto_approve              # 검토 node 없음(약속 v2 그래프)
provider: fake                           # 보고서 llm@1 둘은 가짜 provider(183-01 (가) — 실제 LLM 0)
embedding:                               # D-403 덧: 질의 임베딩만 실제 — 키는 Pack 작업 폴더 .env를 경로로만(배포단 열기 · 복사 0), 주소는 여기
  provider: http
  env_file: ../../c1a15-pack/.env
  base_url: https://api.openai.com/v1
runtime_db:                              # 등록 대조가 장부를 읽을 runtime_reader DSN(store는 없음)
  env_file: ../.env
registration:
  mode: llmops_pg                        # 맥 공유 PG llmops.deployment를 runtime_reader로 SELECT만(줄은 llmops가 만듦)
trace:                                   # 맥 공유 PG trace(trace_writer). 비밀 값은 배포단 .env에만(git 밖, 600)
  dsn_env: LLMOPSAGENT_TRACE_DSN
  env_file: ../.env
  payload_root: ../var/v1-pg-local/trace-payloads   # 맥 LLMOps가 읽는 원문 폴더(LLMOPS_OPS_PAYLOAD_ROOT)와 같게 — 파일 이름 = sha256라 겹치지 않음
outcome_by_node: {}
grounding_keys: []                       # D-278(Q-g (가)): 약속 v2의 alarm · decision · similar · retrieval은 result.output 칸 — state에 없음, 앱은 201 result.output에서 읽음
secret_env_names: [OPENAI_API_KEY]
field_gold:                              # D-470 덧 5 · 6(FIELD-GOLD-E1): 체크 기록 201 뒤 일감 → 일꾼 scripts/field-gold.py가 eval CLI(sha 고정)를 돌려 놓음
  out_dir: ../var/c1a15-dev-local/field-gold/out        # = LLMOps LLMOPS_FIELD_GOLD_DIR(읽기만)
  cli: ../../c1a15-maint-guide-eval/eval/field_gold.py   # eval 가지 eval-gold 10968da
  history_corpus: ../../c1a15-maint-guide-eval/data/history/maintenance_history.jsonl   # 생성 이력 H- 결과(eval 284 Q1 답)
  sha256:
    field_gold: 60b4ccc66494b48c494479b806113272401c947abc89da5827c6e5642d2ecf36
    make_gold: 6554e82c598a80e0fdd831f23ca256700298ca3617ecca3239c2d789a9c27299
    history_corpus: 48a5b999498e46b9f8d8abfea6884b5e4fb0d4682940510776125b530048c506
