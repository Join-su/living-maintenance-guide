# VPS(Compose 서비스) 설정 — VFE EV-005 ES-A(CHG-03). config/v1-pg-local.yaml와 같은 배포 · 실행 설정이고 경로만 컨테이너 안(compose 볼륨)입니다. 비밀 값 없음.
# 등록 장부: PG llmops.deployment를 runtime_reader로 읽기만(registration llmops_pg, EV-005 ES-E) — VPS에는 llmops.db가 없습니다.
deployment_id: task10@v1-pg-local
retention_class: standard            # 운영 배포(dev 7일 보존은 *@dev-local만)
pack:
  repo: /var/lib/deploy/pack-cache/task10-pack   # task10-pack clone 캐시(열쇠 ②, git fetch --tags — 첫 clone은 ES-G)
  ref: v1                            # 태그(task10-pack이 만듦). 응답 pack.tag = "v1"
  pack_subdir: pack
  releases_subdir: releases
  expect_revision: "sha256:3e315c048c962f83981648dc6d6c0f547d39a9ab7c128d331777113cb2bc42ac"   # 태그 v1 알림 값(2026-10-15, CHG-task10-V1-3e315c04, commit 6628470, 10-19 이력 정리 뒤 번호) — EV-002 ES-2 V-17 뒤
execution:                           # pack-resource-contract v1.0 3절 형식(서버가 data_dir/execution-config.yaml로 씀)
  entrypoint: respond
  stores:                            # release는 task10 schema에 적재된 것(개발 DB llmopsagent, runtime_reader로 읽기만)
    history: {backend: postgres-table, release: hc-ai4i2020-s7-v2, connection: {env: LLMOPSAGENT_RUNTIME_DSN}}
    manuals:
      backend: pgvector
      release: ir-manuals-v3-fake    # 가짜 임베딩 release(64차원)와 mode fake가 짝(계약 E-3·E-4). Pack v0 index.embedding과 공급자·모델 같음
      connection: {env: LLMOPSAGENT_RUNTIME_DSN}
      embedding: {mode: fake}
  models: {}
runtime_db:                          # 실행용 DSN(runtime_reader). 환경 변수가 있으면 그것, 없으면 env_file에서 이 이름 한 줄만 읽음
  env_file: /run/deploy/deploy.env   # 읽기 전용 비밀 파일(compose가 붙임, 두 이름만)
data_dir: /var/lib/deploy/data
packs_dir: /var/lib/deploy/data/packs
review_policy: auto_approve          # packrt 정책 이름. 동작은 approve → escalate → reject 순 자동 선택(015c)
provider: fake                       # 실제 provider(http)는 승인 뒤에만
registration:
  mode: llmops_pg                    # 등록 대조: PG llmops.deployment(llmops 0005 · 0006)를 LLMOPSAGENT_RUNTIME_DSN(runtime_db.env_file)으로 SELECT만. 등록은 llmops
trace:                               # 공유 기록기 tracewriter → PostgreSQL trace(trace_writer 계정). 비밀 값은 env_file에만(git 밖)
  dsn_env: LLMOPSAGENT_TRACE_DSN     # 환경 변수가 있으면 그것, 없으면 env_file에서 같은 이름을 찾음
  env_file: /run/deploy/deploy.env   # 읽기 전용 비밀 파일(compose가 붙임, 두 이름만)
  payload_root: /var/lib/payloads   # 공유 볼륨(LLMOps가 ⑨로 원문을 읽음)
outcome_by_node:
  record_no_issue: no_issue
grounding_keys: [answer, evidence, review, alarm_resolution]
secret_env_names: [OPENAI_API_KEY]   # 가림에 쓸 비밀 값의 환경 변수 이름(값은 읽어서 가림에만 씀)
